<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Tejaswi's project collection</title>
<desc id="desc">Nine colorful rounded project tiles in a 3 by 3 grid, with centered geometric icons and brief descriptions.</desc>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#edf1fb"/></linearGradient>
  <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#6338f5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#087ea4"/><stop offset="1" stop-color="#26c6da"/></linearGradient>
  <linearGradient id="lime" x2="1" y2="1"><stop stop-color="#168844"/><stop offset="1" stop-color="#5ce58a"/></linearGradient>
  <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#db2777"/><stop offset="1" stop-color="#ff6d91"/></linearGradient>
  <linearGradient id="orange" x2="1" y2="1"><stop stop-color="#e65a18"/><stop offset="1" stop-color="#ffae42"/></linearGradient>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#56b4ff"/></linearGradient>
  <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#35d4bc"/></linearGradient>
  <linearGradient id="yellow" x2="1" y2="1"><stop stop-color="#a95d04"/><stop offset="1" stop-color="#f6bd36"/></linearGradient>
  <linearGradient id="coral" x2="1" y2="1"><stop stop-color="#c54243"/><stop offset="1" stop-color="#ff8e72"/></linearGradient>
  <filter id="lift" x="-.15" y="-.15" width="1.3" height="1.4"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1c2850" flood-opacity=".14"/></filter>
  <style>
    text{font-family:'Google Sans',Arial,sans-serif}.name{font-size:22px;font-weight:700;fill:#17152d}.desc{font-size:14px;fill:#353d55}.tag{font-size:10px;font-weight:700;letter-spacing:1.6px;fill:#565d75}.iconline{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="660" rx="34" fill="url(#paper)"/>
<circle cx="1100" cy="10" r="190" fill="#8b5cf6" opacity=".055"/><circle cx="60" cy="650" r="170" fill="#06b6d4" opacity=".06"/>
