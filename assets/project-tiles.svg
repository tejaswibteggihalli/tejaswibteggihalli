<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Nine project cards</title>
<desc id="desc">A colorful 3 by 3 grid of rounded glass-style project cards.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1b2540"/></linearGradient>
  <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".045"/></linearGradient>
  <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#060b16" flood-opacity=".42"/></filter>
  <style>text{font-family:'Google Sans',Arial,sans-serif}.title{font-size:23px;font-weight:700;fill:#f4f7ff}.copy{font-size:15px;fill:#c4cee0}.glyph{font-size:28px;font-weight:700;fill:#fff}.caption{font-size:12px;letter-spacing:2px;fill:#98a7c3}</style>
</defs>
<rect width="1200" height="660" rx="34" fill="url(#bg)"/>
<circle cx="1080" cy="40" r="190" fill="#8b5cf6" opacity=".1"/><circle cx="90" cy="620" r="190" fill="#06b6d4" opacity=".08"/>
<g filter="url(#shadow)">
<g transform="translate(32 30)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#a78bfa" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#8b5cf6"/><text x="46" y="56" text-anchor="middle" class="glyph">♞</text><text x="24" y="103" class="caption">CHESS ENGINE</text><text x="24" y="135" class="title">SlowFish</text><text x="24" y="162" class="copy">Search, evaluation &amp; pygame</text></g>
<g transform="translate(420 30)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#22d3ee" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#0891b2"/><text x="46" y="56" text-anchor="middle" class="glyph">◉</text><text x="24" y="103" class="caption">COMPUTER VISION</text><text x="24" y="135" class="title">AMD Detection</text><text x="24" y="162" class="copy">ViT / DeiT · Grad-CAM</text></g>
<g transform="translate(808 30)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#4ade80" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#16a34a"/><text x="46" y="56" text-anchor="middle" class="glyph">♻</text><text x="24" y="103" class="caption">SUSTAINABILITY · ML</text><text x="24" y="135" class="title">WasteSort AI</text><text x="24" y="162" class="copy">Six categories · 96.6% val.</text></g>
<g transform="translate(32 237)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#f472b6" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#db2777"/><text x="46" y="56" text-anchor="middle" class="glyph">⌘</text><text x="24" y="103" class="caption">QUANTUM CIRCUITS</text><text x="24" y="135" class="title">Quarl</text><text x="24" y="162" class="copy">Learning-based optimizer · WIP</text></g>
<g transform="translate(420 237)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#fb923c" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#ea580c"/><text x="46" y="56" text-anchor="middle" class="glyph">▤</text><text x="24" y="103" class="caption">NAND2TETRIS</text><text x="24" y="135" class="title">Hack Assembler</text><text x="24" y="162" class="copy">Two-pass · symbol resolution</text></g>
<g transform="translate(808 237)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#60a5fa" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#2563eb"/><text x="46" y="56" text-anchor="middle" class="glyph">◇</text><text x="24" y="103" class="caption">C · MEMORY</text><text x="24" y="135" class="title">Pointers Field Guide</text><text x="24" y="162" class="copy">Visualizer · lab · 70 cases</text></g>
<g transform="translate(32 444)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#c084fc" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#9333ea"/><text x="46" y="56" text-anchor="middle" class="glyph">◷</text><text x="24" y="103" class="caption">HACKATHON · WEB</text><text x="24" y="135" class="title">Dayflow</text><text x="24" y="162" class="copy">HR prototype · Node.js / SQLite</text></g>
<g transform="translate(420 444)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#fbbf24" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#d97706"/><text x="46" y="56" text-anchor="middle" class="glyph">↗</text><text x="24" y="103" class="caption">GAME PROTOTYPE</text><text x="24" y="135" class="title">GrappyCube</text><text x="24" y="162" class="copy">Platformer · grapple mechanic</text></g>
<g transform="translate(808 444)"><rect width="360" height="185" rx="24" fill="url(#glass)" stroke="#2dd4bf" stroke-opacity=".5"/><rect x="22" y="23" width="48" height="48" rx="16" fill="#0f766e"/><text x="46" y="56" text-anchor="middle" class="glyph">◌</text><text x="24" y="103" class="caption">EMBEDDED · ESP32</text><text x="24" y="135" class="title">Sensor projects</text><text x="24" y="162" class="copy">Air quality · fire alert · irrigation</text></g>
</g>
</svg>
